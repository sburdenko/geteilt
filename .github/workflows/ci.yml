name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Geteilt.Web/package-lock.json

      - name: Restore
        run: dotnet restore

      # Tailwind output is not committed, so the stylesheet is built here or the
      # published app ships without one.
      - name: Build stylesheet
        working-directory: src/Geteilt.Web
        run: |
          npm ci
          npm run build:css

      # Runs before the build so a formatting slip fails in seconds rather than after a full build.
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn
